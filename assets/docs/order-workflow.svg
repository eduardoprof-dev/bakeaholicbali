<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300"><rect width="1400" height="300" rx="28" fill="#fffaf4"/><style>text{font-family:Arial,sans-serif;fill:#35251d}.h{font-size:24px;font-weight:700}.s{font-size:16px;fill:#856c5d}.n{font-size:18px;font-weight:700;fill:#fff}.box{fill:#fff;stroke:#dbcabd;stroke-width:2}.dot{fill:#754528}</style><text x="50" y="52" class="h">Customer order workflow</text><g transform="translate(50 100)"><rect class="box" width="220" height="120" rx="18"/><circle class="dot" cx="35" cy="34" r="19"/><text x="35" y="41" text-anchor="middle" class="n">1</text><text x="110" y="50" class="h">Checkout</text><text x="30" y="88" class="s">Address + quote</text></g><text x="290" y="170" class="h">→</text><g transform="translate(330 100)"><rect class="box" width="220" height="120" rx="18"/><circle class="dot" cx="35" cy="34" r="19"/><text x="35" y="41" text-anchor="middle" class="n">2</text><text x="100" y="50" class="h">Payment</text><text x="30" y="88" class="s">Xendit confirms paid</text></g><text x="570" y="170" class="h">→</text><g transform="translate(610 100)"><rect class="box" width="220" height="120" rx="18"/><circle class="dot" cx="35" cy="34" r="19"/><text x="35" y="41" text-anchor="middle" class="n">3</text><text x="100" y="50" class="h">Prepare</text><text x="30" y="88" class="s">Staff packs order</text></g><text x="850" y="170" class="h">→</text><g transform="translate(890 100)"><rect class="box" width="220" height="120" rx="18"/><circle class="dot" cx="35" cy="34" r="19"/><text x="35" y="41" text-anchor="middle" class="n">4</text><text x="100" y="50" class="h">Approve</text><text x="30" y="88" class="s">Release delivery</text></g><text x="1130" y="170" class="h">→</text><g transform="translate(1170 100)"><rect class="box" width="180" height="120" rx="18"/><circle class="dot" cx="35" cy="34" r="19"/><text x="35" y="41" text-anchor="middle" class="n">5</text><text x="90" y="50" class="h">Deliver</tex