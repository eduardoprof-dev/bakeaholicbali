<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Addresses | Bakeaholic Online Shop</title>
    <link rel="icon" type="image/jpeg" href="/assets/bakeaholic-logo.jpg?v=20260604-session-cart" />
    <link rel="apple-touch-icon" href="/assets/bakeaholic-logo.jpg?v=20260604-session-cart" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=20260725-frame-controls-v20" />
  </head>
  <body>
    <div class="mobile-shell account-page-shell">
      <header class="app-header">
        <div class="brand-row">
          <div class="brand-center">
            <a id="homeLink" href="/index.html">
              <img class="brand-logo" src="/assets/bakeaholic-logo.jpg" alt="Bakeaholic Bali" />
            </a>
          </div>
          <div class="brand-actions" aria-label="Account and cart">
            <a class="header-icon-link" id="cartLink" href="/cart.html" aria-label="Open cart">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.5 6.5h14l-1.6 8.2H8L6.5 6.5Z" />
                <path d="M3.5 4h2.1l.9 2.5" />
                <circle cx="9" cy="19" r="1.4" />
                <circle cx="18" cy="19" r="1.4" />
              </svg>
            </a>
            <button class="profile-pill" id="accountBadge" type="button" aria-label="Account"></button>
            <section class="account-menu" id="accountMenu" hidden>
              <button class="account-summary" id="accountSummaryButton" type="button">
                <strong id="accountMenuName">Customer</strong>
                <span id="accountMenuPhone"></span>
                <span id="accountMenuEmail"></span>
              </button>
              <div class="account-menu-list">
                <a class="account-menu-row account-menu-link" id="accountOrderHistoryLink" href="/orders.html">
                  <span class="account-menu-icon" aria-hidden="true">▣</span>
                  <strong>Order History</strong>
                  <span class="account-menu-arrow">›</span>
                </a>
                <a class="account-menu-row account-menu-link" id="accountAddressesLink" href="/addresses.html">
                  <span class="account-menu-icon" aria-hidden="true">⌖</span>
                  <strong>Your Addresses</strong>
                  <span class="account-menu-arrow">›</span>
                </a>
                <button class="account-menu-row" id="accountLogoutButton" type="button">
                  <span class="account-menu-icon" aria-hidden="true">↪</span>
                  <strong>Log Out</strong>
                  <span class="account-menu-arrow">›</span>
                </button>
              </div>
            </section>
          </div>
        </div>
      </header>
      <main class="account-page" id="addressesApp"></main>
    </div>

    <div class="modal-scrim" id="modalScrim" hidden></div>

    <section class="modal-card location-modal" id="locationModal" hidden>
      <div class="modal-head">
        <h2>Address Details</h2>
        <button class="icon-close" id="closeLocationModal" type="button">×</button>
      </div>
      <div class="location-search-row">
        <input id="locationSearchInput" type="text" placeholder="Search delivery address in Bali" />
        <button class="primary-button compact-button" id="searchLocationButton" type="button">Find</button>
      </div>
      <div class="location-map" id="locationMap"></div>
      <div class="location-summary">
        <strong id="selectedLocationLabel">No location selected yet</strong>
        <p id="selectedLocationAddress">Search or tap the map to pin a delivery location.</p>
        <p id="selectedLocationFee" class="location-fee-copy">Delivery fee will be calculated after you pin the address.</p>
      </div>
      <label class="modal-field location-notes-field">
        <button class="location-notes-toggle" id="locationNotesToggle" type="button">
          <span>Location notes (optional)</span>
          <span>⌄</span>
        </button>
        <textarea id="locationNotesInput" placeholder="e.g. House/unit/floor number" hidden></textarea>
      </label>
      <div class="location-actions">
        <button class="secondary-button full-width" id="useCurrentLocationButton" type="button">Use Current Location</button>
        <button class="primary-button full-width" id="saveLocationButton" type="button">Save Address</button>
      </div>
    </section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="account-common.js?v=20260604-session-cart"></script>
    <script src="location-picker.js?v=20260613-maps-async"></script>
    <script src="meta-pixel.js?v=20260817-csp-fix"></script>
    <script src="addresses.js?v=20260724-visual-pages-v12"></script>
  </body>
</html>
